version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/uploads:/usr/src/app/uploads:ro
      - /root/mvp/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
      - admin-frontend
    restart: always
    networks:
      - polimee-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Nginx経由でアクセスするため、外部ポートは公開しない（必要に応じてコメントアウト）
    # ports:
    #   - "10000:10000"
    env_file: .env
    environment:
      - PORT=10000
      - NODE_ENV=production
    depends_on:
      - db
    restart: always
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    networks:
      - polimee-network

  db:
    image: postgres:15
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mvp_database_g0ic
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Nginx経由でアクセスするため、外部ポートは公開しない（必要に応じてコメントアウト）
    # ports:
    #   - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://api.polimee.com
    restart: always
    depends_on:
      - api
    networks:
      - polimee-network

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    # Nginx経由でアクセスするため、外部ポートは公開しない（必要に応じてコメントアウト）
    # ports:
    #   - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://api.polimee.com
    restart: always
    depends_on:
      - api
    networks:
      - polimee-network

networks:
  polimee-network:
    driver: bridge

volumes:
  db_data:
    driver: local
