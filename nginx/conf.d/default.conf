# フロントエンド（polimee.com, www.polimee.com）
# HTTP から HTTPS にリダイレクト
server {
    listen 80;
    server_name polimee.com www.polimee.com;

    # Certbot の所有権確認用（証明書更新時に必要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # その他すべてのリクエストを HTTPS にリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 設定
server {
    listen 443 ssl;
    http2 on;
    server_name polimee.com www.polimee.com;

    # SSL証明書の設定
    ssl_certificate /etc/nginx/ssl/live/polimee.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/polimee.com/privkey.pem;

    # SSL設定の最適化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# バックエンド API（api.polimee.com）
# HTTP から HTTPS にリダイレクト
server {
    listen 80;
    server_name api.polimee.com;

    # Certbot の所有権確認用（証明書更新時に必要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # その他すべてのリクエストを HTTPS にリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 設定
server {
    listen 443 ssl;
    http2 on;
    server_name api.polimee.com;

    # SSL証明書の設定
    ssl_certificate /etc/nginx/ssl/live/polimee.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/polimee.com/privkey.pem;

    # SSL設定の最適化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://api:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS は NestJS 側で処理するため、Nginx では設定しない
        # credentials: true を使用するため、ワイルドカードは使用不可
    }

    # アップロードファイルの配信
    location /uploads/ {
        alias /usr/src/app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # CORSヘッダーを追加（画像へのアクセスを許可）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
    }
}

